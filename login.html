<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DA Software</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#050816;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#10162A;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:18px;margin-bottom:4px}
p{opacity:.5;font-size:12px;margin-bottom:18px}
input{width:100%;background:#0a0e1f;border:1px solid rgba(255,255,255,.1);color:#fff;padding:12px 14px;border-radius:10px;margin:6px 0;outline:none;font-size:13px}
.btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#00e5ff,#7b61ff);color:#fff}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.15);color:#fff;margin-top:8px}
#msg{margin-top:12px;font-size:11px;padding:10px;border-radius:8px;display:none}
#msg.erro{display:block;background:rgba(255,59,59,.15);border:1px solid rgba(255,59,59,.3);color:#ff8a8a}
#msg.ok{display:block;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
</style>
</head>
<body>
<div class="card">
<h1><i class="fa-solid fa-lock" style="color:#00e5ff"></i> Acesso Restrito</h1>
<p>DA Software - Painel Gerencial</p>

<input id="email" type="email" placeholder="E-mail" autocomplete="email">
<input id="senha" type="password" placeholder="Senha" autocomplete="current-password">

<button id="btnEntrar" class="btn btn-primary" onclick="entrar()"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
<button class="btn btn-outline" onclick="location.href='./index.html'"><i class="fa-solid fa-house"></i> Voltar pro site</button>

<div id="msg"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const SUPABASE_URL="https://ecrpiuhsbhuqcxbbpqfh.supabase.co";
const SUPABASE_KEY="sb_publishable_I7Hw7KieW3VNFqb9LYrFoQ_tFWWABwl";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    storage: window.localStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});

// Se já logado, já manda pro painel
const { data } = await supabase.auth.getSession();
if(data.session){
  location.replace('./painel-gerencial.html');
}

function showMsg(t, tipo){
  const m=document.getElementById('msg');
  m.className = tipo;
  m.style.display='block';
  m.innerText=t;
}

window.entrar = async () => {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const btn = document.getElementById('btnEntrar');
  
  if(!email || !senha){
    showMsg('Preencha e-mail e senha', 'erro');
    return;
  }

  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
  btn.disabled=true;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

  if(error){
    showMsg('Erro: '+error.message, 'erro');
    btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Entrar';
    btn.disabled=false;
    return;
  }

  if(data.session){
    showMsg('Login ok! Redirecionando...', 'ok');
    // Espera 300ms pra garantir que salvou no localStorage
    setTimeout(()=>{
      location.replace('./painel-gerencial.html');
    }, 300);
  } else {
    showMsg('Erro ao criar sessão', 'erro');
    btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Entrar';
    btn.disabled=false;
  }
}

// Enter pra logar
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter') entrar();
});
</script>
</body>
</html>
